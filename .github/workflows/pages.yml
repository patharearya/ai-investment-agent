# Publishes the launch video to GitHub Pages.
#
# The README's poster links here rather than to brag-output/brag.mp4 in the
# repo, because GitHub's file view makes a visitor download an mp4 while Pages
# serves it as video/mp4 and the browser plays it. The site is that one file.

name: pages

on:
  push:
    branches: [main]
    paths:
      - brag-output/brag.mp4
      - .github/workflows/pages.yml
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v7
      - run: mkdir _site && cp brag-output/brag.mp4 _site/
      - uses: actions/upload-pages-artifact@v5
        with:
          path: _site
      - id: deployment
        uses: actions/deploy-pages@v5
